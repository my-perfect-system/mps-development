---
- name: "DEV_ESPIDF_MAIN - Resolve users"
  ansible.builtin.include_tasks: resolve.yml

- name: "DEV_ESPIDF_MAIN - Install ESP-IDF per user"
  ansible.builtin.include_tasks: install.yml
  loop: "{{ espidf_users_present }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    user: "{{ item }}"
  when:
    - user != {}
