---
- name: "DEV_OPENCODE_MAIN - Resolve users"
  ansible.builtin.include_tasks: resolve.yml

- name: "DEV_OPENCODE_MAIN - Install OpenCode + dotfiles per user"
  ansible.builtin.include_tasks: install.yml
  loop: "{{ opencode_users_present }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    user: "{{ item }}"
  when:
    - user != {}
