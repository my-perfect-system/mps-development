---
- name: Install opencode per user
  vars:
    user: "{{ item }}"
  block:
    - name: Check whether opencode is already installed
      ansible.builtin.stat:
        path: "{{ user.home }}/{{ opencode_cli_bin }}"
      register: opencode_installed

    - name: Download opencode installer
      ansible.builtin.get_url:
        url: "{{ opencode_installer_url }}"
        dest: "{{ opencode_installer_path }}"
        mode: "0755"
      when: not opencode_installed.stat.exists

    - name: Run opencode installer as user
      ansible.builtin.command:
        cmd: sudo -u {{ user.name }} "{{ opencode_installer_path }}"
        changed_when: true
      when: not opencode_installed.stat.exists

    - name: Ensure per-user .opencode directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/.opencode"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"
        recurse: true

    - name: Ensure per-user opencode config directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/{{ opencode_config_dst }}/opencode"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"

    - name: Sync opencode configuration into user home
      ansible.posix.synchronize:
        src: "{{ opencode_config_src }}"
        dest: "{{ user.home }}/{{ opencode_config_dst }}/opencode/"
        recursive: true
        delete: false
      become: true
      become_user: "{{ user.name }}"

    - name: Fix ownership of opencode config directory
      ansible.builtin.file:
        path: "{{ user.home }}/{{ opencode_config_dst }}/opencode"
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        recurse: true

    - name: Ensure per-user opencode claude destination directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/{{ opencode_claude_dst }}"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"

    - name: Sync opencode claude config into user home
      ansible.posix.synchronize:
        src: "{{ opencode_claude_src }}"
        dest: "{{ user.home }}/{{ opencode_claude_dst }}/"
        recursive: true
        delete: false
      become: true
      become_user: "{{ user.name }}"

    - name: Fix ownership of opencode claude destination directory
      ansible.builtin.file:
        path: "{{ user.home }}/{{ opencode_claude_dst }}"
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        recurse: true
  loop: "{{ identity_users_resolved | mps_filter_users('development_opencode') }}"
  loop_control:
    label: "{{ item.name }}"
