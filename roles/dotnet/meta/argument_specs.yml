argument_specs:
  main:
    short_description: Install .NET SDK via the official dotnet-install.sh script
    options:
      dotnet_installer_url:
        type: str
        required: false
        default: https://dot.net/v1/dotnet-install.sh
        description: URL of the official dotnet-install.sh script
      dotnet_installer_path:
        type: str
        required: false
        default: /tmp/dotnet-install.sh
        description: Where to download the installer script (cleared after install)
      dotnet_install_args:
        type: str
        required: false
        default: --version latest
        description: Arguments passed to the dotnet-install.sh script
