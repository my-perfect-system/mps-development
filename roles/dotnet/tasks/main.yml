---
- name: "DEV_DOTNET_MAIN - Resolve users"
  ansible.builtin.include_tasks: resolve.yml

- name: "DEV_DOTNET_MAIN - Install .NET SDK per user"
  ansible.builtin.include_tasks: install.yml
  loop: "{{ dotnet_users_present }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    user: "{{ item }}"
  when:
    - user != {}
