---
argument_specs:
  main:
    short_description: Install default JDK and JRE for Debian 13 (trixie)
    options:
      java_packages:
        type: list
        required: false
        default:
          - default-jdk
          - default-jre
        description: Apt packages required for the default Java toolchain
      users_catalog:
        type: dict
        required: false
        default: {}
        description: Identity catalog keyed by unique id — see mps.users.users docs
      users_list:
        type: list
        required: false
        default: []
        description: List of dicts with 'name' (catalog key) and optional 'state'
