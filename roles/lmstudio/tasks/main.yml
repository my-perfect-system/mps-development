---
- name: Install lmstudio per user
  vars:
    user: "{{ item }}"
  block:
    - name: Check whether lmstudio is already installed
      ansible.builtin.stat:
        path: "{{ user.home }}/{{ lmstudio_cli_bin }}"
      register: lmstudio_installed

    - name: Download lmstudio installer
      ansible.builtin.get_url:
        url: "{{ lmstudio_cli_installer_url }}"
        dest: /tmp/lmstudio-install.sh
        mode: "0755"
      when: not lmstudio_installed.stat.exists

    - name: Run lmstudio installer as user
      ansible.builtin.command:
        cmd: sudo -u {{ user.name }} /tmp/lmstudio-install.sh
        changed_when: true
      when: not lmstudio_installed.stat.exists

    - name: Ensure per-user .lmstudio directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/.lmstudio"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"
        recurse: true

    - name: Ensure per-user lmstudio appimage local bin directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/{{ lmstudio_appimage_local_bin }}"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"

    - name: Check whether lmstudio appimage exists
      ansible.builtin.stat:
        path: "{{ user.home }}/{{ lmstudio_appimage_path }}"
      register: lmstudio_appimage_stat

    - name: Download lmstudio appimage
      ansible.builtin.get_url:
        url: "{{ lmstudio_appimage_url }}"
        dest: "{{ user.home }}/{{ lmstudio_appimage_path }}"
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0755"
      when: not lmstudio_appimage_stat.stat.exists

    - name: Ensure per-user applications directory exists
      ansible.builtin.file:
        path: "{{ user.home }}/.local/share/applications"
        state: directory
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0700"

    - name: Deploy lmstudio desktop entry
      ansible.builtin.copy:
        dest: "{{ user.home }}/{{ lmstudio_desktop_file }}"
        owner: "{{ user.name }}"
        group: "{{ user.group | default(user.name) }}"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name=LM Studio
          Comment=Run LM Studio
          Exec={{ user.home }}/{{ lmstudio_appimage_path }}
          Icon=lmstudio
          Terminal=false
          Categories=Development;Utility;
          StartupNotify=true
  loop: "{{ identity_users_resolved | mps_filter_users('development_lmstudio') }}"
  loop_control:
    label: "{{ item.name }}"
